<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Music Cataloger</title>
  <style>
    body {
      background: #101114;
      color: #f5f5f5;
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    main { max-width: 540px; padding: 30px; }
    h1 { font-size: 42px; }
    p { color: #b5b5b5; line-height: 1.7; }

<body>
  <main>
    <h1>Music Cataloger</h1>
    <p>A personal music library organizer and
       DJ playlist builder.</p>

       Build and export playlists directly

    <p>Music metadata powered by
      <a href="https://getsongbpm.com/">
        GetSongBPM
      </a>.
    </p>
